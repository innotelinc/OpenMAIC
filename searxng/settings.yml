# SearXNG for the classroom's research step.
#
# The app's web-search slot had been pointed at its keyless Brave fallback,
# which is rate-limited (HTTP 429) and fails the research step at random.
# SearXNG needs no key, so research works without one.
use_default_settings: true

server:
  # secret_key is deliberately absent: it is a credential, so it lives in
  # Cerulean Vault (cerulean/openmaic#SEARXNG_SECRET) and reaches the container
  # as SEARXNG_SECRET, which SearXNG prefers over this file. A committed
  # literal would be a shared secret in git, and SearXNG refuses to start
  # without one — so a missing vault resolution fails loudly instead of
  # silently running on a value everyone can read.
  #
  # The limiter blocks the JSON API from non-browser clients, which is exactly
  # how lib/web-search/searxng.ts calls it.
  limiter: false
  image_proxy: true
  public_instance: false

search:
  # `format=json` is off in the stock config and the app asks for it.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "en"

ui:
  static_use_hash: true
